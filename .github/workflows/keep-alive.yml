name: Keep Render Backend Awake

on:
  schedule:
    # Every 10 minutes — safely under Render's 15-minute free-tier idle
    # timeout, with room for GitHub's scheduling jitter.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf --max-time 30 https://mediflow-backend-0gpb.onrender.com/api/health \
            && echo "Backend is awake." \
            || echo "Ping failed — backend may be cold-starting or asleep."
